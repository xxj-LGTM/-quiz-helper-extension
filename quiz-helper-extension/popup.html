<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>题目助手</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 328px; padding: 14px; font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: #111827; background: #fff; font-size: 13px; }
  .hd { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  .logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(140deg, #3b82f6, #4f46e5); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; }
  .t { font-weight: 700; font-size: 14px; }
  .s { font-size: 11.5px; color: #6b7280; margin-top: 1px; }
  .card { background: #f8fafc; border: 1px solid #eef1f6; border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; font-size: 12px; }
  .row span { color: #6b7280; flex: none; }
  .row b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .warn { color: #b45309; }
  .ok { color: #15803d; }
  .style-row { display: flex; gap: 4px; background: #f3f4f6; padding: 3px; border-radius: 9px; margin-bottom: 10px; }
  .style-row button { flex: 1; border: none; background: transparent; color: #6b7280; padding: 5px 0; border-radius: 7px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .style-row button.on { background: #fff; color: #1d4ed8; font-weight: 600; box-shadow: 0 1px 2px rgba(15,23,42,.1); }
  button.main { width: 100%; border: none; background: #2563eb; color: #fff; padding: 9px 0; border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
  button.main:hover { background: #1d4ed8; }
  button.ghost { width: 100%; border: 1px solid #e6e9ef; background: #fff; color: #374151; padding: 8px 0; border-radius: 9px; font-size: 12.5px; cursor: pointer; margin-top: 8px; font-family: inherit; }
  button.ghost:hover { border-color: #bfdbfe; color: #1d4ed8; }
  .tip { margin-top: 10px; font-size: 11.5px; color: #9aa3b2; line-height: 1.6; }
  kbd { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 4px; padding: 0 4px; font-size: 10.5px; font-family: inherit; }
  #msg { font-size: 11.5px; margin-top: 8px; min-height: 16px; color: #6b7280; }
</style>
</head>
<body>
  <div class="hd">
    <div class="logo">题</div>
    <div>
      <div class="t">题目助手</div>
      <div class="s" id="status">检查配置…</div>
    </div>
  </div>

  <div class="card">
    <div class="row"><span>服务商</span><b id="provider">-</b></div>
    <div class="row"><span>模型</span><b id="model">-</b></div>
    <div class="row"><span>API Key</span><b id="key">-</b></div>
  </div>

  <div class="style-row" id="styles">
    <button data-style="answer">只要答案</button>
    <button data-style="brief">简要解析</button>
    <button data-style="detail">详细解答</button>
  </div>

  <button class="main" id="open">在当前页面打开解题面板</button>
  <button class="ghost" id="opts">设置 / 填写免费 API Key</button>
  <div id="msg"></div>
  <div class="tip">选中题目文字后按 <kbd>Alt</kbd>+<kbd>Q</kbd> 直接解答；题目是图片就用面板里的「截图识题」。</div>

  <script src="popup.js"></script>
</body>
</html>
